image: debian:bullseye

build-on-x86:
  stage: build
  tags:
    - docker-amd64
  before_script:
    - apt update && apt -y install make autoconf wget tar xz bzip2
    - wget https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-LlCjWuAbzH/9.3.1.2/msp430-gcc-9.3.1.11_linux64.tar.bz2
    - mkdir -p /tmp/msp430-gcc
    - tar xf msp430-gcc-9.3.1.11_linux64.tar.bz2 -C /tmp/msp430-gcc
  script:
    - make MSP430_TOOLCHAIN_PATH="/tmp/msp430-gcc/msp430-gcc-9.3.1.11_linux64"
  artifacts:
    paths:
      - build

build-on-arm:
  stage: build
  tags:
    - docker-aarch64
  before_script:
    - apt update && apt -y install make autoconf wget unzip
    - wget https://git.beagleboard.org/beagleconnect/msp430/msp430-gcc/-/jobs/10937/artifacts/download
    - unzip download
    - cp -r install/* /
  script:
    - make MSP430_TOOLCHAIN_PATH="/usr/local"
  artifacts:
    paths:
      - build
