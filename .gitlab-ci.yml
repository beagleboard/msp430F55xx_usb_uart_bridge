image: debian:bullseye

build-on-x86:
  stage: build
  tags:
    - docker-amd64
  before_script:
    - apt update && apt -y install make autoconf wget tar lbzip2
    - wget "http://software-dl.ti.com/msp430/msp430_public_sw/mcu/msp430/MSPGCC/9_2_0_0/export/msp430-gcc-full-linux-x64-installer-9.2.0.0.run"
    - chmod +x ./msp430-gcc-full-linux-x64-installer-9.2.0.0.run
    - ./msp430-gcc-full-linux-x64-installer-9.2.0.0.run  --mode unattended --prefix /opt/msp430-gcc
    - /opt/msp430-gcc/bin/msp430-elf-gcc --version
  script:
    - make MSP430_TOOLCHAIN_PATH="/opt/msp430-gcc"
  artifacts:
    paths:
      - usb_uart_bridge.*
      - usb_uart_bridge_lp.*

build-on-arm:
  stage: build
  tags:
    - docker-aarch64
  before_script:
    - apt update && apt -y install make autoconf wget unzip
    - wget https://git.beagleboard.org/beagleconnect/msp430/msp430-gcc/-/jobs/10937/artifacts/download
    - unzip download
    - cp -r install/* /
  script:
    - make MSP430_TOOLCHAIN_PATH="/usr/local"
  artifacts:
    paths:
      - usb_uart_bridge.*
      - usb_uart_bridge_lp.*
